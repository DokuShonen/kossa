# ==========================================
# CONFIGURATION DE LA SOURCE DE DONNÉES (POSTGRESQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kossa_db?characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ==========================================
# CONFIGURATION JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURATION SERVEUR
# ==========================================
server.port=${SERVER_PORT:8080}

# ==========================================
# CONFIGURATION JWT
# ==========================================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ==========================================
# CONFIGURATION CORS
# ==========================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# ==========================================
# CONFIGURATION EMAIL (SMTP)
# ==========================================
# Pour activer l'envoi réel : mettre app.mail.enabled=true + renseigner host/port/username/password.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
app.mail.from=${MAIL_FROM:noreply@kossa.bf}

# ==========================================
# CONFIGURATION SMS
# ==========================================
app.sms.enabled=${SMS_ENABLED:false}

# ==========================================
# LOGGING
# ==========================================
logging.level.com.kossa=${LOG_LEVEL:INFO}
